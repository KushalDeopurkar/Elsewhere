name: Scrape Events

on:
  schedule:
    # Run every 6 hours (free tier friendly)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Which scraper to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - allevents
          - insider
          - district
          - meetup
      city:
        description: 'Specific city to scrape (optional)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (no DB writes)'
        required: false
        default: false
        type: boolean

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run scrapers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd backend
          SOURCE="${{ github.event.inputs.source || 'all' }}"
          CITY="${{ github.event.inputs.city || '' }}"
          DRY="${{ github.event.inputs.dry_run || 'false' }}"
          
          CMD="python run_scrapers.py --source $SOURCE"
          
          if [ -n "$CITY" ]; then
            CMD="$CMD --city $CITY"
          fi
          
          if [ "$DRY" = "true" ]; then
            CMD="$CMD --dry-run"
          fi
          
          echo "Running: $CMD"
          $CMD

      # New and edited events get embeddings (meaning-based search, "More like
      # this", the planner), then Telegram alerts go out for what is new.
      # Both endpoints are idempotent, so a retry or an extra run is harmless.
      - name: Embed new events
        if: ${{ github.event.inputs.dry_run != 'true' }}
        continue-on-error: true
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://event-discovery-engine.vercel.app' }}
        run: |
          for i in $(seq 1 20); do
            OUT=$(curl -sS -X POST --max-time 70 "$SITE_URL/api/embed/sync" || echo '{"error":"request failed"}')
            echo "$OUT"
            echo "$OUT" | grep -q '"remaining":0' && break
            echo "$OUT" | grep -q '"error"' && break
          done

      - name: Send Telegram alerts
        if: ${{ github.event.inputs.dry_run != 'true' }}
        continue-on-error: true
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://event-discovery-engine.vercel.app' }}
        run: curl -sS -X POST --max-time 70 "$SITE_URL/api/alerts/run"
