name: Scrape Events

on:
  schedule:
    # Once a day, 02:07 IST. Each run writes ~20k rows for ~30 minutes; the
    # free (Nano) database needs the rest of the day to recover its disk IO
    # budget. Every 6 hours froze it and emptied the site.
    - cron: '37 20 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Which scraper to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - allevents
          - insider
          - district
          - meetup
          - india
          - global
          - ticketmaster
          - seatgeek
          - eventfinda
          - paris
          - ics
          - football
      city:
        description: 'Specific city to scrape (optional)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (no DB writes)'
        required: false
        default: false
        type: boolean

# One job per source, side by side, so the slowest source sets the run time
# instead of all of them added up. Each job leaves its events as a file; the
# save job de-duplicates across sources and writes them once, then runs the
# follow-up steps. A source that fails or runs long only loses its own turn.
concurrency:
  group: scrape-events
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      sources: ${{ steps.pick.outputs.sources }}
    steps:
      - id: pick
        run: |
          SOURCE="${{ github.event.inputs.source || 'all' }}"
          # District blocks GitHub's servers; it runs on the Mac twice a day
          # (com.elsewhere.district.plist). Pick it by name to try it here.
          INDIA='"allevents","meetup"'
          GLOBAL='"ticketmaster","seatgeek","eventfinda","paris","ics","football"'
          case "$SOURCE" in
            all)    LIST="[$INDIA,$GLOBAL]" ;;
            india)  LIST="[$INDIA]" ;;
            global) LIST="[$GLOBAL]" ;;
            *)      LIST="[\"$SOURCE\"]" ;;
          esac
          echo "sources=$LIST" >> "$GITHUB_OUTPUT"
          echo "Sources: $LIST"

  scrape:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(needs.plan.outputs.sources) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Scrape ${{ matrix.source }}
        env:
          # Global sources: each one is skipped if its secret isn't set.
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
          EVENTFINDA_USERNAME: ${{ secrets.EVENTFINDA_USERNAME }}
          EVENTFINDA_PASSWORD: ${{ secrets.EVENTFINDA_PASSWORD }}
          EVENTFINDA_AU_USERNAME: ${{ secrets.EVENTFINDA_AU_USERNAME }}
          EVENTFINDA_AU_PASSWORD: ${{ secrets.EVENTFINDA_AU_PASSWORD }}
          EVENTFINDA_SG_USERNAME: ${{ secrets.EVENTFINDA_SG_USERNAME }}
          EVENTFINDA_SG_PASSWORD: ${{ secrets.EVENTFINDA_SG_PASSWORD }}
          CITY: ${{ github.event.inputs.city || '' }}
        run: |
          cd backend
          ARGS=(--source "${{ matrix.source }}" --out "out/${{ matrix.source }}.jsonl" --budget-min 38)
          if [ -n "$CITY" ]; then ARGS+=(--city "$CITY"); fi
          python run_scrapers.py "${ARGS[@]}"

      - name: Keep the events for the save job
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: events-${{ matrix.source }}
          path: backend/out/*.jsonl
          if-no-files-found: ignore
          retention-days: 2

  save:
    needs: scrape
    # Save whatever the sources that finished brought back, even if one failed.
    if: ${{ always() && needs.scrape.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Collect scraped events
        uses: actions/download-artifact@v7
        with:
          pattern: events-*
          path: backend/in

      - name: Restore checked venue places
        uses: actions/cache@v4
        with:
          path: backend/.geocache.json
          key: geocache-${{ github.run_id }}
          restore-keys: geocache-

      - name: De-duplicate and save
        id: save
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd backend
          mkdir -p in
          if [ "${{ github.event.inputs.dry_run || 'false' }}" = "true" ]; then
            python run_scrapers.py --load in --dry-run
          else
            python run_scrapers.py --load in
          fi

      - name: Re-decide categories of saved events
        if: ${{ github.event.inputs.dry_run != 'true' && steps.save.outputs.db_down != 'true' }}
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd backend
          python run_scrapers.py --recategorize

      # Each upcoming event's own page: full description, ticket tiers
      # (GA, VIP, ...), duration, organiser. Needs migration 008.
      # District blocks cloud servers (its listing scrape returns 0 here too),
      # so District pages are enriched from a home connection instead:
      # double-click enrich-events.command on the Mac.
      - name: Enrich event pages
        if: ${{ github.event.inputs.dry_run != 'true' && steps.save.outputs.db_down != 'true' }}
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd backend
          python run_scrapers.py --enrich-only --source allevents --limit 120
          python run_scrapers.py --enrich-only --source meetup --limit 60
          # iCal calendars (mostly Luma): prices, full descriptions, pictures.
          python run_scrapers.py --enrich-only --source ics --limit 300

      # Pictures for events whose source sends none (iCal calendars such as
      # Luma, SeatGeek, football): the picture each event's own page shares.
      - name: Find event pictures
        if: ${{ github.event.inputs.dry_run != 'true' && steps.save.outputs.db_down != 'true' }}
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd backend
          python run_scrapers.py --images-only --limit 1200

      # New and edited events get embeddings (meaning-based search, "More like
      # this", the planner), then Telegram alerts go out for what is new.
      # Both endpoints are idempotent, so a retry or an extra run is harmless.
      - name: Embed new events
        if: ${{ github.event.inputs.dry_run != 'true' && steps.save.outputs.db_down != 'true' }}
        continue-on-error: true
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://elsewhere-in.vercel.app' }}
        run: |
          for i in $(seq 1 20); do
            OUT=$(curl -sS -X POST --max-time 70 "$SITE_URL/api/embed/sync" || echo '{"error":"request failed"}')
            echo "$OUT"
            echo "$OUT" | grep -q '"remaining":0' && break
            echo "$OUT" | grep -q '"error"' && break
          done

      - name: Send Telegram alerts
        if: ${{ github.event.inputs.dry_run != 'true' && steps.save.outputs.db_down != 'true' }}
        continue-on-error: true
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://elsewhere-in.vercel.app' }}
        run: curl -sS -X POST --max-time 70 "$SITE_URL/api/alerts/run"
